name: Update kurs

on:
  schedule:
    - cron: '7 * * * *' # tiap jam, menit ke-7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-rates.mjs
      - name: Commit jika berubah
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || (git commit -m "chore: update kurs" && git push)
